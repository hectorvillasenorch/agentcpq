<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentCPQ</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
       /* Full-Height Chat Container */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
  }

  /* Chat Header */
  .chat-header {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #2196F3;
      color: white;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
  }

  .robot-icon {
      font-size: 32px;
      margin-right: 10px;
  }

  h2 {
      font-size: 20px;
      margin: 0;
  }

  /* Scrollable Chat Box */
  .chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 15px;
      background-color: #fafafa;
      border: 1px solid #ddd;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      font-size: 20px;
  }

  /* User Message Bubble */
  .user-message {
      background-color: #2196F3;
      color: white;
      padding: 12px;
      border-radius: 15px;
      max-width: 70%;
      align-self: flex-end;
      margin: 5px 0;
      word-wrap: break-word;
      font-size: 20px;
  }

  /* Agent Message Bubble */
  .agent-message {
      color: black;
      padding: 12px;
      border-radius: 15px;
      width: 100%;
      align-self: flex-start;
      margin: 5px 0;
      word-wrap: break-word;
  }

  /* JSON Response Styling */
  .json-preview {
      background-color: #2d2d2d;
      color: #f8f8f2;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-x: auto;
      border: 1px solid #555;
      max-width: 100%;
  }

  /* Fixed Input at Bottom */
  .chat-input-container {
      display: flex;
      flex-direction: column;
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px;
  }

  /* Input and Send Button Wrapper */
  .input-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      background: #f9f9f9;
      width: 100%;
  }
  .chat-input {
    flex-grow: 1;
    border: 0 !important;
    outline: none;
    font-size: 20px !important;
    background: transparent;
    padding: 10px;
}

/* Remove focus styles across all browsers */
.chat-input:focus {
    border: 0 !important;
    outline: none !important;
    box-shadow: none !important;
    -webkit-box-shadow: none !important; /* Chrome/Safari */
    -moz-box-shadow: none !important; /* Firefox */
}

/* Ensure autofill background does not interfere */
.chat-input:-webkit-autofill,
.chat-input:-webkit-autofill:hover, 
.chat-input:-webkit-autofill:focus, 
.chat-input:-webkit-autofill:active {
    box-shadow: 0 0 0px 1000px white inset !important;
    -webkit-box-shadow: 0 0 0px 1000px white inset !important;
}

  .send-button {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 12px 15px;
      margin-left: 10px;
      border-radius: 25px;
      cursor: pointer;
  }

  .send-button:hover {
      background-color: #1976D2;
  }

  /* Small Icon Buttons */
  .chat-actions {
      display: flex;
      justify-content: center;
      margin-top: 10px;
  }

  .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      margin: 0 5px;
      font-size: 22px;
      color: #666;
      transition: color 0.2s ease-in-out;
  }

  .action-btn:hover {
      color: #2196F3;
  }
  </style>
  
</head>
<body class="white lighten-4">
    
  <div class="chat-container">
    <!-- Chat Messages -->
    <div id="chat-box" class="chat-box">
        <div class="agent-message">
           
        </div>
    </div>

    <!-- Chat Input -->
    <div class="chat-input-container">
      <div class="input-wrapper">
          <input type="text" id="user-input" placeholder="Send a message..." class="chat-input">
          <button id="send-btn" class="send-button">
              <i class="material-icons">send</i>
          </button>
      </div>
      
      <!-- Icon Buttons -->
      <div class="chat-actions">
          <button class="action-btn"><i class="material-icons">history</i></button>
          <button class="action-btn"><i class="material-icons">lightbulb</i></button>
          <button class="action-btn"><i class="material-icons">settings</i></button>
      </div>
  </div>

    <input type="hidden" id="csrf-token" value="{{ csrf_token }}">
</div>

    <!-- ✅ JavaScript -->
    <script>
        function setupChatListeners() {
            console.log("Setting up chat listeners...");
            let inputField = document.getElementById("user-input");
            let button = document.getElementById("send-btn");

            if (!inputField || !button) {
                console.error("Chat input or button not found!");
                return;
            }

            button.addEventListener("click", sendMessage);
            inputField.addEventListener("keypress", function (event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });

            console.log("Chat listeners attached.");
        }

        document.addEventListener("DOMContentLoaded", function () {
            setupChatListeners();
        });

        async function sendMessage() {
            let userMessage = document.getElementById("user-input").value.trim();
            let chatBox = document.getElementById("chat-box");
            let csrfToken = document.getElementById("csrf-token")?.value || "";

            if (!userMessage) return;

            let userBubble = document.createElement("div");
            userBubble.classList.add("user-message");
            userBubble.innerHTML = `<strong>You:</strong> ${userMessage}`;
            chatBox.appendChild(userBubble);
            document.getElementById("user-input").value = "";

            try {
                let response = await fetch("/agents/chat/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({ message: userMessage })
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                let data = await response.json();
                let agentBubble = document.createElement("div");
                agentBubble.classList.add("agent-message");

                let formattedResponse = formatAgentResponse(data.response);
                agentBubble.appendChild(formattedResponse);
                chatBox.appendChild(agentBubble);
            } catch (error) {
                console.error("Error:", error);
                let errorBubble = document.createElement("p");
                errorBubble.classList.add("agent-message");
                errorBubble.innerHTML = `<strong>Error:</strong> Could not reach the server.`;
                chatBox.appendChild(errorBubble);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function formatAgentResponse(response) {
          let formattedResponse = document.createElement("div");
          formattedResponse.classList.add("agent-message");
      
          // ✅ Check for JSON format
          if (response.includes("```json")) {
              let jsonContent = response
                  .replace("```json", "")
                  .replace("```", "")
                  .trim();
              
              formattedResponse.innerHTML = `
                  <strong>Agent:</strong> 📄 Here's the structured data:<br>
                  <pre class="json-preview"><code>${jsonContent}</code></pre>
              `;
              return formattedResponse;
          }
      
          // ✅ Check for numbered lists (like explanations)
          if (response.includes("1.") && response.includes("2.")) {
              let listItems = response.split("\n").map(item => {
                  if (item.match(/^\d+\.\s/)) { // Detects numbers followed by ". "
                      return `<li>🔹 ${item}</li>`;
                  }
                  return `<li>${item}</li>`;
              }).join("");
      
              formattedResponse.innerHTML = `
                  <strong>Agent:</strong> 📖 Here's a detailed explanation:<br>
                  <ul class="formatted-list">${listItems}</ul>
              `;
              return formattedResponse;
          }
      
          // ✅ Default response (plain text)
          formattedResponse.innerHTML = `<p>${response}</p>`;
          return formattedResponse;
      }
    </script>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
</html>
