<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentCPQ</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
       /* Full-Height Chat Container */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
  }

  /* Chat Header */
  .chat-header {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #2196F3;
      color: white;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
  }

  .robot-icon {
      font-size: 32px;
      margin-right: 10px;
  }

  h2 {
      font-size: 20px;
      margin: 0;
  }

  /* Scrollable Chat Box */
  .chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 15px;
      background-color: #fafafa;
      border: 1px solid #ddd;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      font-size: 20px;
  }

  /* User Message Bubble */
  .user-message {
      background-color: #2196F3;
      color: white;
      padding: 12px;
      border-radius: 15px;
      max-width: 70%;
      align-self: flex-end;
      margin: 5px 0;
      word-wrap: break-word;
      font-size: 20px;
  }

  /* Agent Message Bubble */
  .agent-message {
      background-color: #f1f1f1;
      color: black;
      padding: 12px;
      border-radius: 15px;
      max-width: 70%;
      align-self: flex-start;
      margin: 5px 0;
      word-wrap: break-word;
  }

  /* JSON Response Styling */
  .json-preview {
      background-color: #2d2d2d;
      color: #f8f8f2;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
      overflow-x: auto;
      border: 1px solid #555;
      max-width: 100%;
  }

  /* Fixed Input at Bottom */
  .chat-input-container {
      display: flex;
      flex-direction: column;
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px;
  }

  /* Input and Send Button Wrapper */
  .input-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      background: #f9f9f9;
      width: 100%;
  }

  .chat-input {
    flex-grow: 1;
    border: 0 !important;
    outline: none;
    font-size: 20px !important;
    background: transparent;
    padding: 10px;
}

.chat-input:focus {
    border: 0 !important;
    outline: none !important;
    box-shadow: none !important;
    -webkit-box-shadow: none !important;
    -moz-box-shadow: none !important;
}

.chat-input:-webkit-autofill,
.chat-input:-webkit-autofill:hover, 
.chat-input:-webkit-autofill:focus, 
.chat-input:-webkit-autofill:active {
    box-shadow: 0 0 0px 1000px white inset !important;
    -webkit-box-shadow: 0 0 0px 1000px white inset !important;
}

  .send-button {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 12px 15px;
      margin-left: 10px;
      border-radius: 25px;
      cursor: pointer;
  }

  .send-button:hover {
      background-color: #1976D2;
  }
    </style>
</head>
<body class="white lighten-4">
    
  <div class="chat-container">
    <div id="chat-box" class="chat-box"></div>
    <div class="chat-input-container">
      <div class="input-wrapper">
          <input type="text" id="user-input" placeholder="Send a message..." class="chat-input">
          <button id="send-btn" class="send-button">
              <i class="material-icons">send</i>
          </button>
      </div>
    </div>
</div>

    <script>
        
      function setupChatListeners() {
        console.log("Setting up chat listeners...");
        let inputField = document.getElementById("user-input");
        let button = document.getElementById("send-btn");

        if (!inputField || !button) {
            console.error("Chat input or button not found!");
            return;
        }

        button.addEventListener("click", sendMessage);
        inputField.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        console.log("Chat listeners attached.");
    }

    document.addEventListener("DOMContentLoaded", function () {
        setupChatListeners();
    });

    async function sendMessage() {
      let userMessage = document.getElementById("user-input").value.trim();
      let chatBox = document.getElementById("chat-box");
  
      if (!userMessage) return;
  
      // Display user message
      let userBubble = document.createElement("div");
      userBubble.classList.add("user-message");
      userBubble.textContent = `You: ${userMessage}`;
      chatBox.appendChild(userBubble);
      document.getElementById("user-input").value = "";
  
      try {
          let response = await fetch("/agents/chat/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: userMessage })
          });
  
          if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
  
          let data = await response.json();
  
          // ✅ Extract the "message" field if the response is an object
          let agentMessage = data.message ? data.message : JSON.stringify(data);
  
          // Display AI response as plain text
          let agentBubble = document.createElement("div");
          agentBubble.classList.add("agent-message");
          agentBubble.textContent = `Agent: ${agentMessage}`;
          chatBox.appendChild(agentBubble);
  
      } catch (error) {
          console.error("Error:", error);
          
          let errorBubble = document.createElement("div");
          errorBubble.classList.add("agent-message");
          errorBubble.textContent = "Error: Could not reach the server.";
          
          chatBox.appendChild(errorBubble);
      }
  
      chatBox.scrollTop = chatBox.scrollHeight;
  }

  function formatAgentResponse(response) {
    let formattedResponse = document.createElement("div");
    formattedResponse.classList.add("agent-message");

    // ✅ Check for JSON format
    if (response.includes("```json")) {
        let jsonContent = response
            .replace("```json", "")
            .replace("```", "")
            .trim();
        
        formattedResponse.innerHTML = `
            <strong>Agent:</strong> 📄 Here's the structured data:<br>
            <pre class="json-preview"><code>${jsonContent}</code></pre>
        `;
        return formattedResponse;
    }

    // ✅ Check for numbered lists (like explanations)
    if (response.includes("1.") && response.includes("2.")) {
        let listItems = response.split("\n").map(item => {
            if (item.match(/^\d+\.\s/)) { // Detects numbers followed by ". "
                return `<li>🔹 ${item}</li>`;
            }
            return `<li>${item}</li>`;
        }).join("");

        formattedResponse.innerHTML = `
            <strong>Agent:</strong> 📖 Here's a detailed explanation:<br>
            <ul class="formatted-list">${listItems}</ul>
        `;
        return formattedResponse;
    }

    // ✅ Default response (plain text)
    formattedResponse.innerHTML = `<p>${response}</p>`;
    return formattedResponse;
}
    </script>

</body>
</html>
