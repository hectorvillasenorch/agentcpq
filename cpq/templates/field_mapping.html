{% load custom_filters %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPQ Field Mapping</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }
    
        .main-content {
            flex: 1;
            padding: 40px 60px;
        }
        .filters {
            display: flex;
            gap: 0px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            justify-content: flex-start;
            border-bottom: 1px solid #e0e0e0;
        }
        .btn{
            box-shadow: none !important;
        }
        .btn-standard {
            border-radius: 20px;
            font-weight: 500;
            font-size: 14px;
            padding: 10px 18px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: none;
            line-height: 1;
            box-shadow: none !important;
        }
        .table-container {
            padding-left: 20px;
            margin-top: 20px;
        }
        table.highlight tbody tr:hover {
            background-color: transparent !important;
        }
        table tr {
            border: none !important;
        }
        table thead th, table tbody td {
            border: none !important;
        }
        .select-wrapper input.select-dropdown {
            border: none !important;
            box-shadow: none !important;
            background-color: transparent !important;
        }
        .crm-input {
            border: 1px solid #ccc !important;
            padding-left: 8px !important;
            border-radius: 8px !important;
            width: 100%;
        }
        
    </style>
</head>
<body>
<div class="layout">


  <!-- Main Content -->
  <main class="main-content">
    <a href="/dashboard/?view=agents"
    class="btn grey lighten-3 black-text"
    style="border-radius: 20px; font-weight: 500;">
   <i class="material-icons left" style="font-size: 18px;">arrow_back</i>
   Back to AgentCPQ
 </a>
    <h4><i class="material-icons left" style="font-size: 20px;">tune</i> CRM Field Mapping</h4>
    <p class="grey-text" style="margin-bottom: 24px;">
    Match your internal fields with CRM data for smooth syncing and reporting.
    </p>
    <!-- Top Row: CRM + Object Selectors -->
    <div class="row filters">
      <div class="input-field col s12 m6">
        <select id="crm" onchange="onAnyDropdownChange()">
          <option value="AgentCPQ" {% if selected_crm == "AgentCPQ" %}selected{% endif %}>AgentCPQ</option>
          <option value="HubSpot" {% if selected_crm == "HubSpot" %}selected{% endif %}>HubSpot</option>
          <option value="Salesforce" {% if selected_crm == "Salesforce" %}selected{% endif %}>Salesforce</option>
        </select>
        <label>Select CRM</label>
      </div>

      <div class="input-field col s12 m6">
        <select id="object_type" onchange="onAnyDropdownChange()">
          {% for model in available_models %}
            <option value="{{ model }}" {% if selected_model == model %}selected{% endif %}>{{ model }}</option>
          {% endfor %}
        </select>
        <label>Select Object Type</label>
      </div>
    </div>
    <!-- Field Mapping Table -->
    <div class="table-container">
      <table class="highlight responsive-table" style="font-size: 15px;">
        <thead>
          <tr>
            <th>AgentCPQ Fields</th>
            <th>CRM Fields</th>
          </tr>
        </thead>
        <tbody id="mapping-table-body">
          <!-- Filled dynamically via JS -->
        </tbody>
      </table>
    </div>

    <!-- Save Button -->
    <div class="row center-align" style="margin-top: 30px;">
        <button class="btn btn-standard blue darken-2 white-text" onclick="saveMappings()">
            <i class="material-icons left">save</i>
            Save Mappings
          </button>
    </div>
  </main>
</div>
   
    
    <script>
        const localFields = {{ local_fields|safe }};
        const fieldMappings = {{ mappings_json|safe }};
        console.log("🧠 localFields is:", localFields);
        console.log("🧠 fieldMappings:", fieldMappings);
      </script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
          var elems = document.querySelectorAll('select');
          M.FormSelect.init(elems);
          updateFields();
          
      });
      function onAnyDropdownChange() {
        const crm = document.getElementById("crm").value;
        const objectType = document.getElementById("object_type").value;
        window.location.href = `/cpq/field-mapping/?crm=${crm}&object_type=${objectType}`;
        console.log("🧠 localFields is:", localFields);
      }
      
      async function saveMappings() {
          let formData = new FormData();
          let crm = document.getElementById("crm").value;
          let objectType = document.getElementById("object_type").value;
          
          formData.append("crm", crm);
          formData.append("object_type", objectType);
          
          document.querySelectorAll('#mapping-table-body tr').forEach(row => {
            const input = row.querySelector('input, select'); // support both <input> and <select>
            if (input) {
                formData.append(input.id.replace("map_", ""), input.value);
            }
          });
      
          try {
              let response = await fetch("/cpq/save-field-mappings/", {  
                  method: "POST",
                  body: formData
              });
      
              let data = await response.json();
              if (data.success) {
                  M.toast({html: `✅ Mappings for ${crm} - ${objectType} saved!`, classes: "green lighten-1"});
              } else {
                  M.toast({html: "❌ Error saving mappings!", classes: "red lighten-1"});
              }
          } catch (error) {
              console.error("Error saving mappings:", error);
              M.toast({html: "❌ Server error. Try again later.", classes: "red lighten-1"});
          }
      }
      
      async function updateFields() {
        const objectType = document.getElementById("object_type").value;
    
        const tableBody = document.getElementById("mapping-table-body");
        tableBody.innerHTML = "";
    
        let crmFields = [];
    
        try {
            const res = await fetch(`/cpq/hubspot/schema/?object_type=${objectType}`);
            const data = await res.json();
    
            if (data.error) {
                console.warn("⚠️ HubSpot schema fetch failed:", data.error);
                M.toast({ html: "⚠️ CRM fields not available", classes: "orange lighten-1" });
            } else {
                crmFields = data.fields;
            }
    
        } catch (err) {
            console.error("HubSpot schema fetch error:", err);
            M.toast({ html: "⚠️ Failed to fetch CRM schema", classes: "orange lighten-1" });
        }
    
        localFields.forEach(field => {
    const row = document.createElement("tr");

    const td1 = document.createElement("td");
    td1.textContent = field;
    row.appendChild(td1);

    const td2 = document.createElement("td");

    // Create text input
    const input = document.createElement("input");
    input.type = "text";
    input.className = "crm-input";
    input.id = `map_${field.replace(/\W+/g, '_')}`;
    input.placeholder = "Enter CRM field";
    
    // ✅ Pre-fill saved mapping from DB
    const saved = fieldMappings[field];
    if (saved) {
        input.value = saved;
    }

    // ✅ Attach datalist for CRM suggestions (if available)
    if (crmFields.length > 0) {
        const dataListId = `datalist_${field.replace(/\W+/g, '_')}`;
        input.setAttribute("list", dataListId);

        const dataList = document.createElement("datalist");
        dataList.id = dataListId;

        crmFields.forEach(fieldName => {
            const option = document.createElement("option");
            option.value = fieldName;
            dataList.appendChild(option);
        });

        td2.appendChild(dataList);
    }

    td2.appendChild(input);
    row.appendChild(td2);
    tableBody.appendChild(row);
});
    
        M.FormSelect.init(document.querySelectorAll('select'));
    }
      </script>

</body>
</html>
