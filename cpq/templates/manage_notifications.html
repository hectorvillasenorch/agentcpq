{% extends "base.html" %}
{% load static %}
{% block content %}
<script src="{% static 'js/agents/agent_main.js' %}" defer></script>
<style>
  input:hover,
  textarea:hover,
  select:hover {
    background-color: transparent !important;
  }

  input,
  textarea,
  select {
    cursor: pointer;
  }
  input:focus,
textarea:focus,
select:focus {
  border-bottom: 1px solid #fc6a3d !important;
  box-shadow: 0 1px 0 0 #fc6a3d !important;
}

input:focus + label,
textarea:focus + label,
select:focus + label {
  color: #fc6a3d !important;
}

.drag-icon {
  color: #9e9e9e;
  font-size: 22px;
  flex-shrink: 0;
}

.green-highlight {
  background-color: #d4edda !important;
  transition: background-color 0.3s ease;
}

.red-highlight {
  background-color: #f8d7da !important;
  transition: background-color 0.3s ease;
}

/* Change checkboxes color when it is activated */
input[type="checkbox"]:checked + span:before {
  border-bottom: 2px solid {{ company.secondary_color }} !important;
  border-right: 2px solid {{ company.secondary_color }} !important;
}

/* Switch color when it is activated */
#template_style_switch:checked + .lever {
  background-color: {{ company.secondary_color }};
}
#template_style_switch:checked + .lever:after {
  background-color: {{ company.secondary_color }};
}

/* Switch color when it is activated */
#description_detail_level_switch:checked + .lever {
  background-color: {{ company.secondary_color }};
}
#description_detail_level_switch:checked + .lever:after {
  background-color: {{ company.secondary_color }};
}


/* Change the span color for checkbox */
input[type="checkbox"] + span {
  color: #212121 !important;  /* o el color que prefieras */
}
.container{
  padding: 24px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
  max-width: none !important;
  width: 100%;
  
}
.card-panel {
  padding: 24px;
  margin: .5rem 0 1rem 0;
  border-radius: 10px;
  background-color: #fff;
  border: 1px solid #e0e0e0;
  box-shadow: none !important;
  overflow: hidden !important;
  max-height: none !important;
  height: auto !important;
}


</style>

<div class="container">
  <div style="display: flex;">
    <i class="material-icons left" style="vertical-align: middle;">notifications</i>
    <b><h3 class="left-align" style="font-family: 'Euclid Circular A', sans-serif;">
      Notifications Management
    </h3></b>
  </div>

  <br>

  <div class="card-panel white z-depth-1">

      <div class="card-panel">
        <b><h6 class="left-align" style="font-family: 'Euclid Circular A', sans-serif;">Account Notifications</h6></b>
        
        <!-- Contenedor principal -->
        <div class="p-6">

          <!-- Botón para abrir modal de Account Notification -->
          <button id="openAccountModal" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            + New Account Notification
          </button>

          <!-- Modal / Panel a mitad de pantalla -->
          <div id="accountModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
            <div class="bg-white rounded-lg w-1/2 p-6 relative">

              <!-- Botón cerrar -->
              <button id="closeAccountModal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700">&times;</button>

              <!-- Título -->
              <h2 class="text-xl font-semibold mb-4">New Account Notification</h2>

              <!-- Formulario -->
              <form class="space-y-4 notification-form" method="POST" action="{% url 'cpq:create_notification' %}">
                {% csrf_token %}

                <!-- Hidden: tipo de notificación -->
                <input type="hidden" name="notification_type" value="account">

                <!-- Select When -->
                <div>
                  <label for="account_when" class="block font-medium mb-1">When:</label>
                  <select id="account_when" name="account_when" class="w-full border-gray-300 rounded px-2 py-1">
                    <option value="created">Created</option>
                  </select>
                </div>

                <!-- Select Recipient -->
                <div>
                  <label for="account_recipient" class="block font-medium mb-1">Recipient:</label>
                  <select id="account_recipient" name="account_recipient" class="w-full border-gray-300 rounded px-2 py-1">
                    <option value="superadmins">Superadmin</option>
                    <option value="admin">Admin</option>
                    <option value="staff">Staff</option>
                    <option value="created-by">Account Creator</option>
                    {% if users %}
                      {% for user in users %}
                        <option value="{{ user.id }}">{{ user.first_name }} {{ user.last_name }} ({{ user.username }})</option>
                      {% endfor %}
                    {% endif %}
                  </select>
                </div>

                <!-- Botón guardar -->
                <div class="text-right">
                  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    Save
                  </button>
                </div>

              </form>
            </div>
          </div>

        </div>

      </div>


      <!-- JS para abrir/cerrar modal -->
      <script>
        const openAccountModal = document.getElementById('openAccountModal');
        const closeAccountModal = document.getElementById('closeAccountModal');
        const accountModal = document.getElementById('accountModal');

        // Abrir modal
        openAccountModal.addEventListener('click', () => {
          accountModal.classList.remove('hidden');

          // Inicializar selects de Materialize dentro del modal
          var elems = accountModal.querySelectorAll('select');
          M.FormSelect.init(elems);
        });

        // AJAX para guardar la notificación sin recargar
        document.querySelectorAll('form.notification-form').forEach(form => {
        form.addEventListener('submit', function(e) {
          e.preventDefault();

          const formData = new FormData(this);
          const modal = this.closest('.modal');

          fetch("{% url 'cpq:create_notification' %}", {
            method: 'POST',
            headers: {'X-CSRFToken': formData.get('csrfmiddlewaretoken')},
            body: formData
          }).then(resp => {
            if(resp.ok){
              M.toast({html: 'Notification saved!'});
              modal.classList.add('hidden');
              this.reset();
            } else {
              M.toast({html: 'Error saving notification', classes: 'red'});
            }
          });
        });
      });


        // Cerrar modal
        closeAccountModal.addEventListener('click', () => {
          accountModal.classList.add('hidden');
        });

        // Cerrar modal haciendo click fuera del panel
        accountModal.addEventListener('click', (e) => {
          if(e.target === accountModal) accountModal.classList.add('hidden');
        });
      </script>
      


    
  </div>

</div>
{% endblock %}
