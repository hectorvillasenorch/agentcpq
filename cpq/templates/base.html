{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}AgentCPQ Admin{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  
</head>
<body class="grey lighten-5">
<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar-toggle" onclick="toggleSidebar()">☰</div>
  <div class="sidenav sidenav-fixed">
      <div class="brand">
          <img width="90%" src="/media/img/logo-small.png" alt="AgentCPQ Logo">
      </div>
      <a href="{% url 'cpq:custom_fields' %}">
        <i class="material-icons">view_list</i> Manage Metadata
      </a>
    
      <a href="{% url 'dashboard' %}?view=setup">
        <i class="material-icons">arrow_back</i> Setup
      </a>
      <div class="divider"></div>
      <div class="session-list">
          <p class="session-list-title">Account</p>
          <a href="{% url 'cpq:get_company_information' %}">
            <i class="material-icons">business</i> Company Information
          </a>
          <a href="#">
            <i class="material-icons">receipt_long</i> Billing
          </a>
          <p class="session-list-title">Document</p>
          <a href="{% url 'cpq:get_document_template' %}">
            <i class="material-icons">note_alt</i> Manage Document
          </a>
      </div>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div id="content-area">
      {% block content %}
      {% endblock %}
    </div>
  </main>
</div>
</body>
</html>
