{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Sent | AgentCPQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Materialize CSS & Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'materialize/materialize.min.css' %}">
  <script src="{% static 'materialize/materialize.min.js' %}" defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      color: #313133;
    }

    .login-wrapper {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .login-left, .login-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .login-left {
      background-color: #313133;
      color: #f5f5f5;
      flex-direction: column;
      text-align: center;
    }

    .login-right {
      flex-direction: column;
      background-color: #ffffff;
    }

    .login-logo {
      width: 250px;
      margin-bottom: 20px;
    }

    .login-title {
      font-size: 30px;
      color: #fc6a3d;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .message-box {
      max-width: 400px;
      text-align: center;
    }

    .message-box h5 {
      color: #fc6a3d;
      font-weight: bold;
    }

    .login-btn {
      background-color: #fc6a3d;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: bold;
      width: fill;
    }

    .login-btn:hover {
      background-color: #fc6a3d;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: bold;
      width: fill;
    }

    @media (max-width: 992px) {
      .login-wrapper {
        flex-direction: column;
      }

      .login-left {
        display: none;
      }

      .login-right {
        padding: 20px;
        height: 100%;
      }
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <!-- Left: Confirmation -->
  <div class="login-left">
    <div class="message-box">
      <h5>Check your inbox</h5>
      <p class="white-text">We've sent a password reset link to your email address.</p>
      <p class="grey-text">If it doesn't arrive soon, check your spam or junk folder.</p>
    </div>
  </div>

  <!-- Right: Logo & Back to login -->
  <div class="login-right">
    <img src="/media/img/logo-bg-white.png" alt="AgentCPQ Logo" class="login-logo">
    <div class="center-align">
      <a href="{% url 'login' %}" class="btn login-btn white-text">
        <i class="material-icons left">arrow_back</i> Back to login
      </a>
    </div>
  </div>

</div>

</body>
</html>
