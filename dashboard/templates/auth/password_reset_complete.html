{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Complete | AgentCPQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Materialize CSS & Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'materialize/materialize.min.css' %}">
  <script src="{% static 'materialize/materialize.min.js' %}" defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      color: #313133;
    }

    .login-wrapper {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .login-left, .login-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .login-left {
      background-color: #313133;
      color: #f5f5f5;
      flex-direction: column;
      text-align: center;
    }

    .login-right {
      flex-direction: column;
      background-color: #ffffff;
    }

    .login-logo {
      width: 250px;
      margin-bottom: 20px;
    }

    .message-box {
      max-width: 400px;
      text-align: center;
    }

    .message-box h5 {
      color: #fc6a3d;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .login-btn {
      background-color: #fc6a3d;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: bold;
      width: fill;
    }

    .login-btn:hover {
      background-color: #fc6a3d;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: bold;
      width: fill;
    }

    @media (max-width: 992px) {
      .login-wrapper {
        flex-direction: column;
      }

      .login-left {
        display: none;
      }

      .login-right {
        padding: 20px;
        height: 100%;
      }
    }
  </style>
</head>

<body>

<div class="login-wrapper">

  <!-- Left: Confirmation Message -->
  <div class="login-left">
    <div class="message-box">
      <h5>Password Reset Successful</h5>
      <p class="white-text">Your password has been reset successfully. You can now log in with your new password.</p>
    </div>
  </div>

  <!-- Right: Logo & Login Button -->
  <div class="login-right">
    <img src="/media/img/logo-bg-white.png" alt="AgentCPQ Logo" class="login-logo">
    <a href="{% url 'login' %}" class="btn login-btn white-text center-align">
      <i class="material-icons left">login</i> Back to Login
    </a>
  </div>

</div>

</body>
</html>
